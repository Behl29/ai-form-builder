[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.redis", "php82Extensions.gd", "php82Extensions.pcntl", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.mbstring", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "npm install",
    "npm run build",
    "composer install --optimize-autoloader --no-dev --no-interaction"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
